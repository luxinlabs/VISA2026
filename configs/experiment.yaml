  eval: instances 1-3 of each template (114 tasks; 38 template clusters)
analysis:
  bootstrap_replicates: 10000
  confidence_level: 0.95
  cluster_key: template
  secondary_cluster_key: task_id
  multiplicity: holm over the 5 pre-specified contrasts
