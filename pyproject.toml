[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agentisa-bench"
version = "0.1.0"
description = "Research scaffold for controlled agent-facing virtual ISA interface evaluation"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "jsonschema>=4"]
[tool.setuptools.packages.find]
where = ["src"]
